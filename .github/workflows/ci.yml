name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dev_user
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: inex_glass_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dev_user -d inex_glass_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # Test-only values, not real secrets. Shared by migrate, seed, `next start` and Playwright.
    env:
      DATABASE_URL: postgresql://dev_user:dev_password@localhost:5432/inex_glass_test
      PAYLOAD_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      FORM_HMAC_SECRET: ci-hmac-ci-hmac-ci-hmac-ci-hmac-0000
      ORDER_TOKEN_SECRET: ci-order-ci-order-ci-order-ci-order-00
      SITE_URL: http://localhost:3100
      SITE_ENV: development
      JOBS_ENABLED: "false"
      # The app is built by the `pnpm build` step below; Playwright only runs `next start`.
      E2E_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Next.js incremental build cache: exact hit when lockfile and sources are unchanged,
      # otherwise restore the latest cache for the same lockfile (or any) and rebuild on top.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', 'src/**/*.css', 'public/**', 'next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - run: pnpm build

      - run: pnpm migrate
      # Full seed: wave 5 slice specs expect full content. Drop `|| echo` after task 16.
      # The package.json seed script ends with `--`, so bare flags reach the script.
      - run: pnpm seed --full || echo "seed not available"

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # The restored .next/cache carries the data cache of earlier runs / the build: drop it so
      # `next start` reads CMS data from this run's freshly seeded database.
      - name: Clear Next data cache
        run: rm -rf .next/cache/fetch-cache

      - run: pnpm test:e2e
        env:
          # Migrations and seed already ran in the steps above.
          E2E_SKIP_DB: "1"
          # The single e2e admin (e2e/helpers/admin.ts). The fresh CI database has no users,
          # so the first spec that needs it registers it via first-register. Test-only values.
          E2E_ADMIN_EMAIL: e2e-admin@inexglass.test
          E2E_ADMIN_PASSWORD: e2e-admin-password-0000

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
