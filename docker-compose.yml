# Dev environment: Postgres 18 + Mailpit (SMTP catcher).
# The init script runs only on an empty volume (`docker compose down -v` to recreate).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: inex_glass
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql # postgres:18 keeps data in /var/lib/postgresql/18/docker
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d inex_glass"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"] # SMTP / web UI
volumes:
  pgdata:
