<svg width="880" height="300" viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kromka-title kromka-desc" font-family="Rubik, system-ui, sans-serif">
  <!--
    Source of the edge profiles diagram (Paper mockup 2560_service_kromka, frame «diagram»). The
    site shows the raster `kromka.webp` next to this file (export 2x from Paper, Rubik baked in):
    the media collection does not accept SVG uploads (stored XSS). After editing this file,
    re-export the WebP under a NEW file name (seed media are keyed by file name) and update the
    service seed. Edge terminology follows priorglass.ru: «еврокромка» = trapezoid, «карандаш» =
    rounded. Colours = tokens: #16403D primary-dark, #2B8C7E primary, #DCEBE8 teal-wash,
    #9AA1A8 text-muted, #5B636B text-2.
  -->
  <title id="kromka-title">Профиль торца в сечении</title>
  <desc id="kromka-desc">Четыре вида кромки в сечении, стекло слева, торец справа. Шлифованная — матовый торец. Полированная — прозрачный торец с блеском. «Еврокромка» — трапеция, фаски под углом. «Карандаш» — скруглённый торец.</desc>
  <text x="0" y="40" font-size="15" fill="#5B636B">← стекло</text>
  <text x="880" y="40" text-anchor="end" font-size="15" fill="#5B636B">торец →</text>

  <rect x="30" y="100" width="140" height="70" fill="#DCEBE8" stroke="#2B8C7E" stroke-width="2" />
  <line x1="170" y1="100" x2="170" y2="170" stroke="#9AA1A8" stroke-width="7" stroke-dasharray="3 3" />
  <text x="100" y="222" text-anchor="middle" font-size="18" font-weight="600" fill="#16403D">Шлифованная</text>
  <text x="100" y="248" text-anchor="middle" font-size="15" fill="#5B636B">матовый торец</text>

  <rect x="250" y="100" width="140" height="70" fill="#DCEBE8" stroke="#2B8C7E" stroke-width="2" />
  <line x1="390" y1="100" x2="390" y2="170" stroke="#16403D" stroke-width="6" />
  <text x="320" y="222" text-anchor="middle" font-size="18" font-weight="600" fill="#16403D">Полированная</text>
  <text x="320" y="248" text-anchor="middle" font-size="15" fill="#5B636B">прозрачный, с блеском</text>

  <polygon points="470,100 592,100 610,118 610,152 592,170 470,170" fill="#DCEBE8" stroke="#2B8C7E" stroke-width="2" />
  <polyline points="592,100 610,118 610,152 592,170" fill="none" stroke="#16403D" stroke-width="4" stroke-linejoin="round" />
  <text x="540" y="222" text-anchor="middle" font-size="18" font-weight="600" fill="#16403D">«Еврокромка»</text>
  <text x="540" y="248" text-anchor="middle" font-size="15" fill="#5B636B">трапеция, фаски под углом</text>

  <path d="M690 100 H795 A35 35 0 0 1 795 170 H690 Z" fill="#DCEBE8" stroke="#2B8C7E" stroke-width="2" />
  <path d="M795 100 A35 35 0 0 1 795 170" fill="none" stroke="#16403D" stroke-width="4" />
  <text x="760" y="222" text-anchor="middle" font-size="18" font-weight="600" fill="#16403D">«Карандаш»</text>
  <text x="760" y="248" text-anchor="middle" font-size="15" fill="#5B636B">скруглённый торец</text>
</svg>
