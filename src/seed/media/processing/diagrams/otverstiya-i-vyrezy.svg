<svg width="880" height="320" viewBox="0 0 880 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="holes-title holes-desc" font-family="Rubik, system-ui, sans-serif">
  <!--
    Source of the hole distance diagram (Paper mockup 2560_service_otverstiya, frame «diagram»).
    The site shows the raster `otverstiya-i-vyrezy.webp` next to this file (export 2x from Paper,
    Rubik baked in): the media collection does not accept SVG uploads (stored XSS). After editing
    this file, re-export the WebP under a NEW file name (seed media are keyed by file name) and
    update the service seed.
    Colours = tokens: #16403D primary-dark, #1F6B60 primary-pressed, #2B8C7E primary,
    #DCEBE8 teal-wash, #5B636B text-2, #FFFFFF surface.
  -->
  <title id="holes-title">Схема расстояний для отверстий, t — толщина стекла</title>
  <desc id="holes-desc">Лист стекла с тремя отверстиями и вырезом. От угла стекла до кромки отверстия — не меньше 6t, от кромки стекла до кромки отверстия и между кромками двух отверстий — не меньше 2t, диаметр отверстия — не меньше t, вырез — с радиусом от 10 мм. Пример для стекла 10 мм: 2t = 20 мм, 6t = 60 мм.</desc>
  <rect x="120" y="40" width="640" height="250" fill="#DCEBE8" stroke="#2B8C7E" stroke-width="2" />
  <circle cx="226" cy="119" r="24" fill="#FFFFFF" stroke="#16403D" stroke-width="2.5" />
  <circle cx="430" cy="230" r="24" fill="#FFFFFF" stroke="#16403D" stroke-width="2.5" />
  <circle cx="514" cy="230" r="24" fill="#FFFFFF" stroke="#16403D" stroke-width="2.5" />
  <rect x="620" y="90" width="100" height="80" rx="10" fill="#FFFFFF" stroke="#16403D" stroke-width="2.5" />
  <line x1="120" y1="40" x2="207" y2="105" stroke="#1F6B60" stroke-width="2" stroke-dasharray="6 4" />
  <text x="142" y="104" font-size="20" font-weight="600" fill="#16403D">6t</text>
  <line x1="430" y1="254" x2="430" y2="290" stroke="#1F6B60" stroke-width="2" />
  <line x1="422" y1="254" x2="438" y2="254" stroke="#1F6B60" stroke-width="2" />
  <text x="440" y="280" font-size="20" font-weight="600" fill="#16403D">2t</text>
  <line x1="454" y1="230" x2="490" y2="230" stroke="#1F6B60" stroke-width="2" />
  <line x1="454" y1="222" x2="454" y2="238" stroke="#1F6B60" stroke-width="2" />
  <line x1="490" y1="222" x2="490" y2="238" stroke="#1F6B60" stroke-width="2" />
  <text x="472" y="196" text-anchor="middle" font-size="20" font-weight="600" fill="#16403D">2t</text>
  <text x="262" y="126" font-size="16" fill="#5B636B">Ø не меньше t</text>
  <text x="670" y="196" text-anchor="middle" font-size="16" fill="#5B636B">вырез, R от 10 мм</text>
  <text x="120" y="314" font-size="16" fill="#5B636B">Пример для стекла 10 мм: 2t = 20 мм, 6t = 60 мм</text>
</svg>
