<svg width="880" height="300" viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plenki-title plenki-desc" font-family="Rubik, system-ui, sans-serif">
  <!--
    Source of the film diagram (Paper mockup 2560_service_plenki, frame «diagram»). The site shows
    the raster `plenki.webp` next to this file (export 2x from Paper, Rubik baked in): the media
    collection does not accept SVG uploads (stored XSS). After editing this file, re-export the
    WebP under a NEW file name (seed media are keyed by file name) and update the service seed.
    Colours = tokens: #16403D primary-dark, #1F6B60 primary-pressed, #2B8C7E primary
    (film and zone with opacity), #DCEBE8 teal-wash, #EEF2F0 tint-green, #5B636B text-2.
  -->
  <title id="plenki-title">Где плёнка на стекле</title>
  <desc id="plenki-desc">Слева сечение: плёнка наклеена на стекло с одной стороны, сторона наклейки — по чертежу. Справа вид спереди: полоса «зона наклейки» на стекле, её высота задаётся в чертеже.</desc>
  <text x="60" y="30" font-size="16" font-weight="600" fill="#16403D">сечение</text>
  <rect x="60" y="112" width="320" height="12" fill="#2B8C7E" fill-opacity="0.55" />
  <rect x="60" y="124" width="320" height="56" fill="#DCEBE8" stroke="#2B8C7E" stroke-width="2" />
  <text x="220" y="158" text-anchor="middle" font-size="16" fill="#1F6B60">стекло</text>
  <line x1="330" y1="112" x2="360" y2="72" stroke="#5B636B" stroke-width="1.5" />
  <text x="366" y="68" font-size="16" fill="#5B636B">плёнка</text>
  <text x="60" y="250" font-size="16" fill="#5B636B">сторона наклейки — по чертежу</text>
  <text x="520" y="30" font-size="16" font-weight="600" fill="#16403D">вид спереди</text>
  <rect x="520" y="50" width="300" height="240" fill="#EEF2F0" stroke="#2B8C7E" stroke-width="2" />
  <rect x="520" y="130" width="300" height="70" fill="#2B8C7E" fill-opacity="0.35" />
  <text x="670" y="171" text-anchor="middle" font-size="16" font-weight="500" fill="#16403D">зона наклейки</text>
  <line x1="845" y1="130" x2="845" y2="200" stroke="#1F6B60" stroke-width="2" />
  <line x1="835" y1="130" x2="855" y2="130" stroke="#1F6B60" stroke-width="2" />
  <line x1="835" y1="200" x2="855" y2="200" stroke="#1F6B60" stroke-width="2" />
</svg>
